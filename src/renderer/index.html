<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wikipedia Theme Crawler</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>📚 Wikipedia Theme Crawler</h1>
      <p class="subtitle">テーマ別にWikipediaコンテンツを収集・保存</p>
    </header>

    <main>
      <section class="config-section">
        <h2>設定</h2>

        <div class="form-group">
          <label for="language">言語</label>
          <select id="language" class="mdc-select">
            <option value="ja">日本語 (ja)</option>
            <option value="en">English (en)</option>
            <option value="de">Deutsch (de)</option>
            <option value="fr">Français (fr)</option>
            <option value="es">Español (es)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="mode">収集モード</label>
          <select id="mode" class="mdc-select">
            <option value="category">カテゴリ</option>
            <option value="search">キーワード検索</option>
            <option value="links">リンク追跡</option>
            <option value="manual">手動リスト</option>
          </select>
        </div>

        <div class="form-group" id="queryGroup">
          <label for="query" id="queryLabel">クエリ</label>
          <input type="text" id="query" class="mdc-text-field" placeholder="例: 日本の歴史">
          <div id="categoryHelp" class="help-text">
            カテゴリ名を入力 (例: 日本の歴史, 物理学)
          </div>
        </div>

        <div class="form-group" id="linkDepthGroup" style="display: none;">
          <label for="linkDepth">リンク深度</label>
          <input type="number" id="linkDepth" class="mdc-text-field" value="1" min="1" max="3">
        </div>

        <div class="form-group">
          <label for="maxArticles">最大記事数</label>
          <input type="number" id="maxArticles" class="mdc-text-field" value="50" min="1" max="1000">
        </div>

        <div class="form-group">
          <label for="format">保存形式</label>
          <select id="format" class="mdc-select">
            <option value="markdown">Markdown (.md)</option>
            <option value="html">HTML (.html)</option>
            <option value="json">JSON (.json)</option>
          </select>
        </div>

        <div class="form-group">
          <label>
            <input type="checkbox" id="includeImages" class="mdc-checkbox">
            画像もダウンロード
          </label>
        </div>

        <div class="form-group">
          <label for="theme">テーマ名</label>
          <input type="text" id="theme" class="mdc-text-field" placeholder="例: Japanese_History">
        </div>

        <div class="form-group">
          <label for="outputDirectory">出力ディレクトリ</label>
          <div class="directory-selector">
            <input type="text" id="outputDirectory" class="mdc-text-field" readonly placeholder="選択してください">
            <button id="selectDirBtn" class="mdc-button mdc-button--outlined">
              <span class="material-icons">folder_open</span>
              選択
            </button>
          </div>
        </div>

        <div class="button-group">
          <button id="startBtn" class="mdc-button mdc-button--raised">
            <span class="material-icons">play_arrow</span>
            開始
          </button>
          <button id="stopBtn" class="btn-danger" disabled>停止</button>
        </div>
      </section>

      <section class="progress-section" id="progressSection" style="display: none;">
        <h2>進捗状況</h2>
        <div class="progress-bar">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-text" id="progressText">0 / 0</p>
        <p class="current-article" id="currentArticle"></p>
      </section>

      <section class="result-section" id="resultSection" style="display: none;">
        <h2>完了</h2>
        <p id="resultText"></p>
      </section>
    </main>

    <footer>
      <p>Wikipedia Theme Crawler v1.0.0</p>
    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
